name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: 检查 tkinter 可用
        shell: pwsh
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: 安装打包依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: 检查 matplotlib TkAgg 后端
        shell: pwsh
        run: python -c "import matplotlib; matplotlib.use('TkAgg'); from matplotlib.backends.backend_tkagg import FigureCanvasTkAgg; print('TkAgg ok')"

      - name: 打包单文件 exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean wlanlab_gui.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist/WlanLab-CSMA-CA.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 打包带控制台的自检 exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name smoke-check `
            --hidden-import matplotlib.backends.backend_tkagg `
            --hidden-import PIL.ImageTk `
            --hidden-import PIL._tkinter_finder `
            --exclude-module PyQt5 --exclude-module PyQt6 `
            --exclude-module PySide2 --exclude-module PySide6 `
            --exclude-module IPython --exclude-module scipy --exclude-module pandas `
            run_gui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 自检：冻结后的 exe 能否真的起窗口
        continue-on-error: true
        shell: pwsh
        run: |
          & ./dist/smoke-check.exe --smoke 2>&1 | ForEach-Object { "$_" }
          Write-Host "smoke exit code = $LASTEXITCODE"
          $warn = "build/smoke-check/warn-smoke-check.txt"
          if (Test-Path $warn) { Write-Host '--- warnings ---'; Get-Content $warn | Select-Object -First 40 }

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: WlanLab-CSMA-CA-win64
          path: dist/WlanLab-CSMA-CA.exe
          if-no-files-found: error
          retention-days: 30
